---
# Assert stunnel__psk_dst and stunnel__psk_content are defined

- name: Assert stunnel__psk_dst is defined
  ansible.builtin.assert:
    that:
      - stunnel__psk_dst is defined
    fail_msg: "stunnel__psk_dst is not defined. Please define it to specify the path where the PSK file will be stored on the server."

- name: Assert stunnel__psk_content is defined
  ansible.builtin.assert:
    that:
      - stunnel__psk_content is defined
    fail_msg: "stunnel__psk_content is not defined. Please define it to specify the content of the PSK file."

- name: Install stunnel4 package
  ansible.builtin.apt:
    name: stunnel4
    state: present

- name: Symlink stunnel configuration file
  ansible.builtin.file:
    src: "{{ infrastructure_repository_dest }}/confs/gpu-01/stunnel/off.conf"
    dest: /etc/stunnel/off.conf
    state: link
    force: true

# Override default systemd config with override.conf

- name: Create systemd override directory for stunnel
  ansible.builtin.file:
    path: /etc/systemd/system/stunnel@.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Symlink stunnel systemd override configuration file
  ansible.builtin.file:
    src: "{{ infrastructure_repository_dest }}/confs/gpu-01/systemd/override.conf"
    dest: /etc/systemd/system/stunnel@.service.d/override.conf
    state: link

- name: Ensure directory for PSK file exists
  ansible.builtin.file:
    path: "{{ stunnel__psk_dst | dirname }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Create PSK file for stunnel
  ansible.builtin.template:
    src: stunnel-psk.txt.j2
    dest: "{{ stunnel__psk_dst }}"
    mode: "0600"
    owner: root
    group: root

# Enable and restart stunnel service if needed
- name: Enable and restart stunnel service if needed
  ansible.builtin.import_role:
    name: git_based_configs
    tasks_from: enable_service.yml
  vars:
    git_based_configs__service_name: stunnel@off.service

# Allow traffic on stunnel port (5506 and 5507) with iptables
- name: Allow incoming traffic on stunnel port 5506 and 5507
  ansible.builtin.iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: ACCEPT
    state: present
  loop:
    - 5506
    - 5507
