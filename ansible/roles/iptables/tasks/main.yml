# Install and manage iptables
---
- name: Install iptables and netfilter-persistent
  ansible.builtin.apt:
    pkg:
      - ipset
      - iptables
      - netfilter-persistent
      - iptables-persistent
      - ipset-persistent
    state: present
    update_cache: true

- name: Eventually enable ip v4 forward
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "{{ iptables__enable_ip_forward_v4 | default(false) }}"

- name: Eventually enable ip v6 forward
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "{{ iptables__enable_ip_forward_v6 | default(false) }}"

- name: Setup the rules for iptables v4
  ansible.builtin.template:
    src: iptables_rules.j2
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: "0600"
  vars:
    iptables_rules_version: v4
  register: iptables_rules_v4_generation

- name: Setup the rules for iptables v6
  ansible.builtin.template:
    src: iptables_rules.j2
    dest: /etc/iptables/rules.v6
    owner: root
    group: root
    mode: "0600"
  vars:
    iptables_rules_version: v6
  register: iptables_rules_v6_generation

- name: Setup the rules for ipset
  ansible.builtin.template:
    src: ipsets.j2
    dest: /etc/iptables/ipsets
    owner: root
    group: root
    mode: "0600"
  register: iptables_ipsets_generation

- name: Reload ipset rules  # noqa: no-handler
  ansible.builtin.shell: >-
    ipset restore -exist < /etc/iptables/ipsets
  changed_when: true
  when: iptables_ipsets_generation.changed
  notify:
    # theoritically no docker daemon is required, but better safe than sorry…
    - "iptables - restart docker daemon"

- name: Reload iptables rules  # noqa: no-handler
  community.general.iptables_state:
    ip_version: "ip{{ item }}"
    path: /etc/iptables/rules.{{ item }}
    state: restored
    wait: 6
  # iptables_state restored needs poll to be 0 and async to be >2 < ansible_timeout
  poll: 0
  async: 5
  loop: ["v4", "v6"]
  when: iptables_rules_v4_generation.changed or iptables_rules_v6_generation.changed
  notify:
    # we need to restart docker daemon to reload its own iptables rules
    - "iptables - restart docker daemon"
