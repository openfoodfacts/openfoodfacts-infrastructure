# Installing memcached prometheus exporter
---

- name: Get the archive of the project
  ansible.builtin.get_url:
    src: https://github.com/prometheus/memcached_exporter/releases/download/v{{ memcached__exporter_version }}/memcached_exporter-{{ memcached__exporter_version }}.linux-amd64.tar.gz
    dest: /tmp/memcached_exporter-{{ memcached__exporter_version }}.tar.gz
  register: _memcached__exporter_archive_download

- name: Unpack the binary from archive
  ansible.builtin.unarchive:
    remote_src: true
    src: {{ _memcached__exporter_archive_download.dest }}
    include:
      - memcached_exporter
    dest: /usr/local/bin/
  when: _memcached__exporter_archive_download.changed

- name: Symlink systemd service definition using git_based_config
  git_based_config_symlinks:
    src: "{{ memcached__git_config_path_systemd }}"
    dst: "/etc/systemd/system"

- name: Enable and restart memcached exporter service if needed
  ansible.builtin.include_role:
    name: git_based_configs
    tasks_from: enable_service.yml
  vars:
    git_based_configs__service_name: "prometheus-memcached-exporter.service"
