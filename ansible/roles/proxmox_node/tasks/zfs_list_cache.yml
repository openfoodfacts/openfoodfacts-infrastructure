---
# Implements the "Important note when you mount datasets from other zpool"
# see docs/explanation/software/virtiofs.md#inter-zpool-mounts
#
# This ensures the zfs-mount-generator (part of zfsutils-linux) has the
# per-zpool cache files it needs to order mounts across different zpools,
# and verifies that datasets mounted outside of their own zpool hierarchy
# declare an org.openzfs.systemd:requires-mounts-for property pointing to a
# parent mountpoint, so that systemd mounts them in the right order.

- name: Install zfsutils-linux and zfs-zed
  ansible.builtin.package:
    name:
      - zfsutils-linux
      - zfs-zed
    state: present

- name: Ensure zfs-zed service is enabled and running
  ansible.builtin.systemd:
    name: zfs-zed
    enabled: true
    state: started

- name: Verify zfs-list-cacher zedlet is present
  ansible.builtin.stat:
    path: /etc/zfs/zed.d/history_event-zfs-list-cacher.sh
  register: proxmox_node_zfs_zedlet

- name: Assert zfs-list-cacher zedlet is present
  ansible.builtin.assert:
    that:
      - proxmox_node_zfs_zedlet.stat.exists
    fail_msg: >-
      /etc/zfs/zed.d/history_event-zfs-list-cacher.sh is missing.
      It is normally provided by the zfs-zed package and is required by
      zfs-mount-generator to keep the per-zpool cache up to date.

- name: Ensure zfs-list.cache directory exists
  ansible.builtin.file:
    path: /etc/zfs/zfs-list.cache
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Gather existing zpools
  ansible.builtin.command: zpool list -o name -H
  register: proxmox_node_zpools
  changed_when: false

- name: Touch cache file for each zpool (preserving existing ones)
  ansible.builtin.file:
    path: "/etc/zfs/zfs-list.cache/{{ item }}"
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: root
    group: root
    mode: "0644"
  loop: "{{ proxmox_node_zpools.stdout_lines }}"
  loop_control:
    label: "{{ item }}"

- name: Stat each zpool cache file
  ansible.builtin.stat:
    path: "/etc/zfs/zfs-list.cache/{{ item }}"
    get_checksum: false
  loop: "{{ proxmox_node_zpools.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  register: proxmox_node_cache_stat

# An empty (or absent) cache file means the zedlet has not populated it yet.
# Toggling atime on then off on the pool root dataset triggers a history
# event that the zedlet handles to (re)generate the cache.
- name: Trigger cache regeneration for zpools with an empty cache file
  ansible.builtin.shell: |
    set -e
    zfs set atime=on {{ item.item }}
    zfs set atime=off {{ item.item }}
  args:
    executable: /bin/bash
  loop: "{{ proxmox_node_cache_stat.results | selectattr('stat.size', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: Re-stat each zpool cache file after regeneration
  ansible.builtin.stat:
    path: "/etc/zfs/zfs-list.cache/{{ item }}"
    get_checksum: false
  loop: "{{ proxmox_node_zpools.stdout_lines }}"
  loop_control:
    label: "{{ item }}"
  register: proxmox_node_cache_stat_after

- name: Verify cache files are populated for each zpool
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.size > 0
    fail_msg: >-
      /etc/zfs/zfs-list.cache/{{ item.item }} is empty.
      The zfs-list-cacher zedlet did not populate it. Ensure zfs-zed is
      running and that a dataset property change was triggered.
  loop: "{{ proxmox_node_cache_stat_after.results }}"
  loop_control:
    label: "{{ item.item }}"

# Now verify that any dataset mounted outside of its own zpool hierarchy
# declares org.openzfs.systemd:requires-mounts-for pointing to a parent
# mountpoint, so systemd mounts it after its parent (from another zpool).
- name: Gather zfs datasets with their mountpoint and requires-mounts-for
  ansible.builtin.command: >-
    zfs list -o name,mountpoint,org.openzfs.systemd:requires-mounts-for -H
  register: proxmox_node_zfs_datasets
  changed_when: false

- name: Validate requires-mounts-for on datasets mounted outside their dataset
  ansible.builtin.assert:
    that:
      - proxmox_node_requires_mounts_errors | length == 0
    fail_msg: >-
      The following datasets are mounted outside their own zpool hierarchy
      but have a missing or invalid 'org.openzfs.systemd:requires-mounts-for'
      property (it must point to a parent mountpoint):
      {{ proxmox_node_requires_mounts_errors | join('\n      ') }}
  vars:
    proxmox_node_requires_mounts_errors: >-
      {{ proxmox_node_zfs_datasets.stdout | zfs_validate_requires_mounts_for }}
