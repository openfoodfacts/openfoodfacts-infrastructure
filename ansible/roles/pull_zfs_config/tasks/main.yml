---
- name: Ensure local pulled_confs root exists
  ansible.builtin.file:
    path: "{{ pull_zfs_config__pulled_confs_root }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Ensure local host directory exists for pulled ZFS config
  ansible.builtin.file:
    path: "{{ pull_zfs_config__output_path | dirname }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Gather ZFS pools facts
  community.general.zpool_facts:
    properties: all
    parsable: true

- name: Set sorted ZFS pool names
  ansible.builtin.set_fact:
    pull_zfs_config__pool_names: >-
      {{
        (ansible_zfs_pools | default([])
        | map(attribute='name')
        | list)
        | sort
      }}

- name: Gather ZFS datasets facts recursively from each pool
  community.general.zfs_facts:
    name: "{{ item }}"
    recurse: true
    type: "filesystem,volume"
    properties: all
    parsable: true
  loop: "{{ pull_zfs_config__pool_names }}"
  register: pull_zfs_config__zfs_facts
  when: pull_zfs_config__pool_names | length > 0

- name: Build sorted ZFS export payload
  ansible.builtin.set_fact:
    pull_zfs_config__export_payload:
      pools: "{{ (ansible_zfs_pools | default([])) | pull_zfs_config_facts_by_name(['local']) }}"
      datasets: "{{ (pull_zfs_config__zfs_facts.results | default([])) | pull_zfs_config_facts_by_name(['local', 'received']) }}"

- name: Write ZFS configuration export as JSON
  ansible.builtin.copy:
    dest: "{{ pull_zfs_config__output_path }}"
    content: "{{ pull_zfs_config__export_payload | to_nice_json }}\n"
    mode: "0644"
  delegate_to: localhost
  become: false
