# {{ ansible_managed }}


{% for site in reverse_proxy_websites %}

# ============ {{ site.url }} ============

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name  {{ site.url }};
    
    location / {
        proxy_pass http://{{ site.proxy_pass }}$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90;
        client_max_body_size 512M;
    }
    
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    # managed by Certbot
    ssl_certificate /etc/nginx/ssl/live/certificate/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/certificate/privkey.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name  {{ site.url }};

    location / {
        return 301 https://$host$request_uri;
    }
}

{% endfor %}
