- name: Create linux user for reverse proxy
  ansible.builtin.user:
    name: "{{ reverse_proxy_user }}"
    comment: "User used by nginx reverse proxy"
    append: true
    groups: docker # append the docker group to the user, to allow docker commands
    state: present
    create_home: true
    password: "*" # ie no password / no login

- name: Create certbot directory
  ansible.builtin.file:
    path: "{{ reverse_proxy_dir }}/certbot"
    state: directory
    owner: "{{ reverse_proxy_user }}"
    group: "{{ reverse_proxy_user }}"
    mode: "0755"

- name: Copy base nginx config & docker compose
  ansible.builtin.copy:
    src: .
    dest: "{{ reverse_proxy_dir }}"
    owner: "{{ reverse_proxy_user }}"
    group: "{{ reverse_proxy_user }}"
    mode: "0644"

- name: Copy templated nginx sites config
  ansible.builtin.template:
    src: ./nginx/sites.conf
    dest: "{{ reverse_proxy_dir }}/nginx/sites.conf"
    owner: "{{ reverse_proxy_user }}"
    group: "{{ reverse_proxy_user }}"
    mode: "0644"

- name: Copy templated certbot ovh.ini config
  ansible.builtin.template:
    src: ./certbot/ovh.ini
    dest: "{{ reverse_proxy_dir }}/certbot/ovh.ini"
    owner: "{{ reverse_proxy_user }}"
    group: "{{ reverse_proxy_user }}"
    mode: "0600"

- name: Copy templated certbot script
  ansible.builtin.template:
    src: ./certbot/certbot-renew.sh
    dest: "{{ reverse_proxy_dir }}/certbot/certbot-renew.sh"
    owner: "{{ reverse_proxy_user }}"
    group: "{{ reverse_proxy_user }}"
    mode: "0644"

- name: Start docker compose reverse proxy
  community.docker.docker_compose_v2:
    project_src: "{{ reverse_proxy_dir }}"
    state: present
