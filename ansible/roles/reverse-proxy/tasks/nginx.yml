- name: Fail if password_hash is defined without username, or username without password_hash
  ansible.builtin.fail:
    msg: >-
      Both 'username' and 'password_hash' must be defined together for {{ item.url }}.
  when: >
    (item.password_hash is defined and item.username is not defined) or
    (item.username is defined and item.password_hash is not defined)
  loop: "{{ reverse_proxy_websites }}"

- name: Create password file
  ansible.builtin.template:
    src: ./nginx/basic_auth_password
    dest: "{{ reverse_proxy_dir }}/nginx/passwords/{{ item.url }}"
    owner: "{{ reverse_proxy_user }}"
    group: "www-data" # group used by nginx to read the passwords
    mode: "0660"
  loop: "{{ reverse_proxy_websites }}"
  when: item.password_hash is defined
  vars:
    username: "{{ item.username }}"
    password_hash: "{{ item.password_hash }}"

- name: Get the list of all password files in the directory
  ansible.builtin.find:
    paths: "{{ reverse_proxy_dir }}/nginx/passwords"
    file_type: file
  register: found_files

- name: Delete password files that are not used anymore
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ found_files.files | rejectattr('path', 'in', active_names) | list }}"
  loop_control:
    label: "{{ item.path }}"
  vars:
    active_names: "{{ reverse_proxy_websites | map(attribute='url') | map('regex_replace', '^', reverse_proxy_dir + '/nginx/passwords/') | list }}"

- name: Copy templated nginx sites config
  ansible.builtin.template:
    src: ./nginx/sites.conf
    dest: "{{ reverse_proxy_dir }}/nginx/sites.conf"
    owner: "{{ reverse_proxy_user }}"
    group: "{{ reverse_proxy_user }}"
    mode: "0644"
