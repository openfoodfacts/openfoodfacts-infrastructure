---
- name: Install nullmailer package
  ansible.builtin.apt:
    name: nullmailer
    state: present

- name: Set nullmailer configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/nullmailer/{{ item.path }}"
    mode: "0644"
  with_community.general.filetree:
    - ../templates
  loop_control:
    label: "{{ item.path }}"
  notify: restart nullmailer
  tags:
    - config

- name: Set mailname for applications using it
  ansible.builtin.copy:
    dest: "/etc/mailname"
    content: "{{ nullmailer__mailname }}\n"
    mode: "0644"
  notify: restart nullmailer
  tags:
    - config

- name: Ensure nullmailer service is started and enabled at boot
  ansible.builtin.service:
    name: nullmailer
    enabled: true
