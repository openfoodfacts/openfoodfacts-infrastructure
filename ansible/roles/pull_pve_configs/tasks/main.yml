---
- name: Ensure local directory exists for each host
  ansible.builtin.file:
    path: "{{ pull_pve_configs__host_output_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false

- name: Find /etc/pve files
  ansible.builtin.find:
    paths: "{{ pull_pve_configs__source_dir }}"
    file_type: file
    recurse: true
  register: _pull_pve_configs__files

- name: Fetch /etc/pve files
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: "{{ pull_pve_configs__pulled_confs_root }}"
  loop: "{{ _pull_pve_configs__files.files }}"
