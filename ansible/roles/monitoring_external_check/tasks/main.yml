---
- name: Install curl, used by check script
  ansible.builtin.package:
    name: curl
    state: present

- name: Add check script
  ansible.builtin.copy:
    src: check_monitoring_stack.sh
    dest: /usr/local/sbin/check_monitoring_stack.sh
    mode: "0755"

- name: Add monitoring_external_check service and timer units
  ansible.builtin.template:
    src: monitoring_external_check.{{ item }}.j2
    dest: /etc/systemd/system/monitoring_external_check.{{ item }}
    mode: "0644"
  loop:
    - service
    - timer
  notify: "monitoring_external_check : Restart monitoring_external_check timer"

- name: Enable monitoring_external_check timer
  ansible.builtin.systemd_service:
    name: monitoring_external_check.timer
    state: started
    enabled: true
    daemon_reload: true
