[proxmox_nodes]
off1 ansible_ssh_host=213.36.253.206
off2 ansible_ssh_host=213.36.253.208
ovh1 ansible_ssh_host=146.59.148.140 extra_host_ips="2001:41d0:203:948c::1"
ovh2 ansible_ssh_host=51.210.154.203 extra_host_ips="2001:41d0:403:41cb::2"
ovh3 ansible_ssh_host=51.210.32.79
# backup server
hetzner-01 ansible_ssh_host=49.12.168.77 extra_host_ips="2a01:4f8:2190:1498::2" proxmox_api_local_port=8101
# compute server
hetzner-02 ansible_ssh_host=88.99.90.100 extra_host_ips="2a01:4f8:10a:1a95::2" proxmox_api_local_port=8102
hetzner-03 ansible_ssh_host=195.201.104.92 extra_host_ips="2a01:4f8:13a:a2::2" proxmox_api_local_port=8103

[proxmox_nodes:vars]
# establish a tunnel to be able to join the API from localhost
# Each host must have it's own proxmox_api_local_port to avoid conflicts
ansible_ssh_common_args = '-L {{ proxmox_api_local_port }}:127.0.0.1:8006'

[hetzner_containers]
hetzner-02-proxy ansible_ssh_host=10.12.1.100 proxmox_node="hetzner-02"
folksonomy-staging ansible_ssh_host=10.12.1.110 proxmox_node="hetzner-02"

[hetzner_containers:vars]
# Jump through proxmox node
ansible_ssh_common_args = '-J {{ hostvars[proxmox_node]["ansible_ssh_host"] }}'

[reverse_proxy_hosts]
hetzner-02-proxy

[pve-hetzner]
hetzner-01
hetzner-02
hetzner-03

[standalone_servers]
# servers that are not proxmox nodes but are standalone servers
