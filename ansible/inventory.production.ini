off2 ansible_ssh_host=213.36.253.208 extra_host_ips="2a01:e0d:1:c:58bf:fad0:0:1"
proxy_off1 ansible_ssh_host=213.36.253.215
proxy_off2 ansible_ssh_host=213.36.253.214
