[defaults]
inventory = ./inventory.production.ini

# wazuh-ansible is vendored as a git submodule and is a bundle of roles in a
# single repository, so its roles do not live in roles.galaxy/ but one level down
roles_path = roles.galaxy:roles:vendor/wazuh-ansible/roles
collections_path = ./collections/
# we need module utils from lae.proxmox
module_utils=./plugins/module_utils:./roles.galaxy/lae.proxmox/module_utils/

gathering = smart

# Automaticaly detects the Python interpreter on the host and don't display a warning
interpreter_python = auto_silent

lookup_plugins = ./plugins/lookup:~/.ansible/plugins/lookup:/usr/share/ansible/plugins/lookup
filter_plugins = ./plugins/filter:~/.ansible/plugins/filter:/usr/share/ansible/plugins/filter
library = ./plugins/modules:~/.ansible/plugins/modules/:/usr/share/ansible/plugins/modules/

[ssh_connection]
# These settings create a persistent SSH socket that can be reused
# We need this because we would like to use ssh tunneling
# to access proxmox API
ssh_args = -o ControlMaster=auto -o ControlPersist=180s
# we use a socket in .ssh because it is a secure place
control_path = ~/.ssh/ansible-ssh-%%h-%%p-%%r
