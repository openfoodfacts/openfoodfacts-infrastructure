- name: Configure monitoring server
  hosts: monitoring-01
  gather_facts: true
  become: true
  roles:
    - role: docker
      tags: docker
    - role: continuous-deployment
      tags: cd
    - role: reverse-proxy
      tags: reverse-proxy
  tasks:
    - name: Copy prometheus secrets
      ansible.builtin.copy:
        content: "{{ prometheus_auth_secrets[item] }}"
        dest: /home/off/monitoring/configs/prometheus/secrets/{{ item }}.txt
        owner: "off"
        group: "off"
        mode: "0600"
      loop: "{{ prometheus_auth_secrets.keys() }}"
      tags: prometheus-secrets
