---
# TODO(FeatSetupScaleway): Does this defines the IP or is it defined elsewhere and I should put it here?
proxmox_node__pve_cluster_addr0: 10.13.0.1

# Reproduced the current config gotten with: zpool list -v -P
proxmox_node__zfs_pools:
  - name: rpool
    vdev: mirror nvme-eui.000000000000000100a0752249f51d6e-part3 nvme-TS4TMTE250S_I209080271-part3
    properties:
      ashift: "12"
    filesystem_properties: "{{ proxmox_node__zfs_pools_filesystem_properties_defaults }}"
  - name: zfs-hdd
    vdev: raidz2 sda1 sdb1 sdc1 sdd1 sde1 sdf1
    properties:
      ashift: "12"
    filesystem_properties: "{{ proxmox_node__zfs_pools_filesystem_properties_defaults }}"

# Reproduced the current config gotten with: zfs list
proxmox_node__zfs_filesystems:
  - name: rpool/ROOT
  - name: rpool/ROOT/pve-1
  - name: rpool/data
  # TODO(FeatSetupScaleway): Those do not exist currently, should we create them?
  - name: zfs-hdd/pve
  - name: zfs-hdd/backups


proxmox_node__pve_storages:
  - name: zfs-hdd-pve
    type: zfspool
    pool: zfs-hdd/pve
    content: rootdir,images
    mountpoint: /zfs-hdd/pve # TODO(FeatSetupScaleway): See TODO remark above
    sparse: 0
    shared: 0
  - name: local
    type: dir
    path: /var/lib/vz
    content: vztmpl,snippets,iso
    shared: 0
  # removing installed storage
  - name: zfs-hdd
    type: zfspool
    pool: zfs-hdd
    state: absent
