---
proxmox_node__pve_cluster_addr0: 10.13.0.1

# ZFS pools were created manually. We keep them out of Ansible as they might be modified manually.
proxmox_node__zfs_pools: []

# Some ZFS other file systems were created manually. We keep them out of Ansible as they might be modified manually.
proxmox_node__zfs_filesystems:
  - name: zfs-hdd/pve
  - name: zfs-hdd/backups


proxmox_node__pve_storages:
  - name: zfs-hdd-pve
    type: zfspool
    pool: zfs-hdd/pve
    content: rootdir,images
    mountpoint: /zfs-hdd/pve
    sparse: 0
    shared: 0
  - name: local
    type: dir
    path: /var/lib/vz
    content: vztmpl,snippets,iso
    shared: 0
  # removing installed storage
  - name: zfs-hdd
    type: zfspool
    pool: zfs-hdd
    state: absent
