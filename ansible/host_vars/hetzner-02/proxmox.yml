---
proxmox_node__pve_cluster_addr0: 10.12.0.2

proxmox_node__zfs_pools:
  - name: rpool
    vdev: raidz1 nvme0n1p5 nvme1n1p5
    properties:
      ashift: "12"
    filesystem_properties: "{{ proxmox_node__zfs_pools_filesystem_properties_defaults }}"

proxmox_node__zfs_filesystems:
  - name: rpool/pve
  - name: rpool/backups

proxmox_node__pve_storages:
  - name: rpool-pve
    type: zfspool
    pool: rpool/pve
    content: rootdir,images
    mountpoint: /rpool/pve
    sparse: 0
    shared: 0
  - name: local
    type: dir
    path: /var/lib/vz
    content: vztmpl,snippets,iso
    shared: 0

proxmox_containers__containers:
  - id: 100
    hostname: hetzner-02-proxy
    features:
      - nesting=1
    cores: 4
    memory: "{{ 2 * 1024 }}"
    netif:
      # public network
      # we put it first so that it's the default route
      net0:
        name: eth0
        # this ip was given by hetzner as an additional ip
        ip: 88.99.90.81/26
        # we ask for a distinct MAC for the additional IP
        # and we must use it
        hwaddr: "00:50:56:01:11:4D"
        gw: 88.99.90.65
        # Alex: tried to use vmbr2 but it did not work…
        bridge: vmbr0
      net1:
        name: eth1
        ip: 10.12.1.100/16
        # we intentionally remove the gateway
        # so that default route should be eth0
        # gw: 10.12.0.2
        bridge: vmbr1
    disk:
      storage: rpool-pve
      size: 32
  - id: 110
    hostname: folksonomy-staging
    features:
      - nesting=1
    cores: 4
    memory: "{{ 4 * 1024 }}"
    netif:
      net0:
        name: eth0
        ip: 10.12.1.110/16
        gw: 10.12.0.2
        bridge: vmbr1
    disk:
      storage: rpool-pve
      size: 32

