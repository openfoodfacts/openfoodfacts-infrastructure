---
proxmox_node__pve_cluster_addr0: 10.13.0.2

# ZFS pools were created manually. We keep them out of Ansible as they might be modified manually.
proxmox_node__zfs_pools: []
_proxmox_node__zfs_filesystems_specific:
  - name: zfs-hdd/virtiofs
    properties:
      # this is mandatory for virtiofs to work well in linux
      acltype: posixacl
  - name: zfs-hdd/virtiofs/qm-200
  - name: zfs-hdd/virtiofs/qm-200/docker-volumes
  - name: zfs-nvme/virtiofs
    properties:
      # this is mandatory for virtiofs to work well in linux
      acltype: posixacl
  # data volumes
  # The following volumes are created on the nvme pool, because we want to benefit from
  # better performance for databases, but we mount them in the
  # `/zfs-hdd/virtiofs/qm-200/docker-volumes` dir, where all other docker volumes are
  # located. These other volumes are on the hdd pool.
  - name: zfs-nvme/virtiofs/qm-200-off_shared_mongodb_data
    properties:
      # we need to mount it in the right place for docker in the VM
      mountpoint: /zfs-hdd/virtiofs/qm-200/docker-volumes/off_shared_mongodb_data
      org.openzfs.systemd:requires-mounts-for: /zfs-hdd/virtiofs/qm-200/docker-volumes
  - name: zfs-nvme/virtiofs/qm-200-off_shared_redis_data
    state: absent
  - name: zfs-nvme/virtiofs/qm-200-off_shared_redisdata
    properties:
      # we need to mount it in the right place for docker in the VM
      mountpoint: /zfs-hdd/virtiofs/qm-200/docker-volumes/off_shared_redisdata
      org.openzfs.systemd:requires-mounts-for: /zfs-hdd/virtiofs/qm-200/docker-volumes
  - name: zfs-nvme/virtiofs/qm-200-off_shared_pg_data
    properties:
      # we need to mount it in the right place for docker in the VM
      mountpoint: /zfs-hdd/virtiofs/qm-200/docker-volumes/off_shared_pg_data
      org.openzfs.systemd:requires-mounts-for: /zfs-hdd/virtiofs/qm-200/docker-volumes

proxmox_node__zfs_filesystems: |
  {{
    pvescaleway_common_proxmox_node__zfs_filesystems +
    _proxmox_node__zfs_filesystems_specific
  }}

proxmox_node__pve_storages:
  - name: zfs-hdd-pve
    type: zfspool
    pool: zfs-hdd/pve
    content: rootdir,images
    mountpoint: /zfs-hdd/pve
    sparse: 0
    # shared: 0 # for some reason, this flag did make the setup crash
  - name: local
    type: dir
    path: /var/lib/vz
    content: vztmpl,snippets,iso
    shared: 0
  # removing installed storage
  - name: zfs-hdd
    type: zfspool
    pool: zfs-hdd
    state: absent

proxmox_containers__containers:
  - id: 101
    hostname: scaleway-stunnel-client
    features:
      - nesting=1
    cores: 2
    memory: "{{ 1024 }}"
    netif:
      net0:
        name: eth0
        ip: 10.13.1.101/16
        gw: 10.13.0.2
        bridge: vmbr10
        ip6: 2001:bc8:c025:10::101/48
        gw6: "2001:bc8:c025:ffff:ffff:ffff:ffff:ff7f"
    disk:
      storage: zfs-hdd-pve
      size: 10
  - id: 102
    hostname: scaleway-memcached
    features:
      - nesting=1
    cores: 2
    # memcached, we need memory
    memory: "{{ 1024 * 20 }}"
    netif:
      net0:
        name: eth0
        ip: 10.13.1.102/16
        gw: 10.13.0.2
        bridge: vmbr10
    disk:
      storage: zfs-hdd-pve
      size: 10
