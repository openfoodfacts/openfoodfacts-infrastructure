---
- name: Pull proxmox cluster config files
  hosts: hetzner-01:scaleway-01
  gather_facts: false
  vars:
    repository_root: "{{ lookup('ansible.builtin.env', 'OFF_INFRA_REPOSITORY_ROOT') | default((playbook_dir | dirname | dirname), true) }}"
    pulled_confs_dir: "{{ repository_root }}/pulled_confs/{{ inventory_hostname }}"
  tasks:
    - name: Ensure local directory exists for each host
      ansible.builtin.file:
        path: "{{ pulled_confs_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: Find /etc/pve files
      ansible.builtin.find:
        paths: /etc/pve
        file_type: file
        recurse: true
      register: pve_files

    - name: Fetch /etc/pve files
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ repository_root }}/pulled_confs"
      loop: "{{ pve_files.files }}"
