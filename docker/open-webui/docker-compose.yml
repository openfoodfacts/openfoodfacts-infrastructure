services:
  openwebui:
    restart: always
    image: ghcr.io/open-webui/open-webui:v0.13.3
    ports:
      - "6010:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      WEBUI_URL: https://openwebui.openfoodfacts.org
      CORS_ALLOW_ORIGIN: https://openwebui.openfoodfacts.org
volumes:
  open-webui-data:
    external: true
