site_name: Open Food Facts Infrastructure documentation
site_dir: gh_pages

# Where to find documentation
docs_dir: docs
# Link to Github on every page
repo_url: https://github.com/openfoodfacts/openfoodfacts-infrastructure
edit_uri: blob/develop/docs/

theme:
  name: material
  features:
    - content.action.edit
  logo: https://static.openfoodfacts.org/images/logos/off-logo-horizontal-light.svg
  favicon: https://static.openfoodfacts.org/images/logos/off-logo-favicon-light.png
  palette: 
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/brightness-7 
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - footnotes
  - pymdownx.highlight
  - pymdownx.superfences:
      # mermaidjs graph supported by material theme
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      # add permalink after titles
      permalink: "#"
  # this one allow to have two space indentation
  # counts as nested list
  - mdx_truly_sane_lists
  - mdx_breakless_lists

plugins:
  # thanks to this plugin, the .pages files will customize navigation entries
  - awesome-nav
  - search
  # glightbox is for images
  - glightbox:
      auto_caption: true

