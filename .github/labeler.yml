# Add labels to any pull request with changes to the specified paths

# Pull requests that update GitHub Actions code. If you navigate to the folder, you will have a README of what it does
GitHub Actions:
- changed-files:
  - any-glob-to-any-file: '.github/**/*'

"📚 documentation":
- changed-files:
  - any-glob-to-any-file: 'docs/**/*'
  - any-glob-to-any-file: 'mkdocs.yml'
  - any-glob-to-any-file: 'README.md'

"🪦 postmortems":
- changed-files:
  - any-glob-to-any-file: 'docs/reports/**/*'

