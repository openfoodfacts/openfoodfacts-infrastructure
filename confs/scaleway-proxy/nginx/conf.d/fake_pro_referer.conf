# Flag requests carrying a fake "pro" platform referrer.
# The pro platform only exists for Open Food Facts (*.pro.openfoodfacts.org),
# so a referrer on *.pro.openbeautyfacts.org, *.pro.openproductsfacts.org
# or *.pro.openpetfoodfacts.org cannot be legitimate.
# 2026-10-26: a distributed scraper flooded obf/opf facet pages with such referrers,
# see docs/reports/2026-10-26-obf-opf-fake-pro-referer-scraper.md
# Used in sites-enabled/openbeautyfacts.org, openproductsfacts.org and openpetfoodfacts.org
map $http_referer $fake_pro_referer {
    default 0;
    "~*^https?://([^/?#]*\.)?pro\.open(beauty|products|petfood)facts\.org([:/?#]|$)" 1;
}
