# Stunnel configuration for hetzner stunnel client
# /usr/share/doc/stunnel4/examples/stunnel.conf-sample

# we need this to run it smoothly with systemd
foreground = yes
# drop root
setuid = stunnel4
setgid = stunnel4
pid = /var/run/stunnel-off/stunnel.pid

# off query .net postgres
[OffQueryNetPostgres]
client = yes
accept = 0.0.0.0:16022
connect = 46.105.72.120:16022
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/postgres-query-net-psk.txt


# off query .org postgres
[OffQueryOrgPostgres]
client = yes
accept = 0.0.0.0:16002
connect = 2a06:c484:5::102:16002
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/postgres-query-org-psk.txt

