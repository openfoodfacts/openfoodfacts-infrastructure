# Stunnel configuration for off services
# /usr/share/doc/stunnel4/examples/stunnel.conf-sample

# we need this to run it smoothly with systemd
foreground = yes
# drop root
setuid = stunnel4
setgid = stunnel4

pid = /var/run/stunnel-off/stunnel.pid
# Can be emerg, alert, crit, err, warning, notice, info or debug
debug = err

# stunnel client is for client = yes service, the other should go to reverse-proxy

[OffPostgres]
client = yes
accept = 5432
connect = 213.36.253.214:5432
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/postgres-psk.txt

[OffRedis]
client = yes
accept = 6379
connect = 213.36.253.214:6379
PSKsecrets = /etc/stunnel/psk/redis-psk.txt
