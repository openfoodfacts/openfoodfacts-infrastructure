# sanoid conf data - see https://github.com/jimsalterjrs/sanoid/wiki/Sanoid

# base policy
[rpool]
  use_template=local_sys
  recursive=yes

# host system
[rpool/ROOT]
  use_template=local_sys
  recursive=yes

[rpool/data]
  use_template=local_data
  recursive=yes

[rpool/var-lib-vz]
  use_template=local_sys
  recursive=yes

# base policy
[zfs-hdd]
  use_template=local_sys
  recursive=yes

[zfs-hdd/pve]
  # we use local_sys because we need not too much snapshots
  # as space is limited
  use_template=local_sys
  recursive=yes

# off backups
[zfs-hdd/off-backups]
  use_template=synced_data
  recursive=yes
# root dirs of off-backups are in synced_data mode, but not synced, so we need to ignore them
# no_sanoid_checks: zfs-hdd/off-backups:zfs-hdd/off-backups/off1-zfs-hdd:zfs-hdd/off-backups/off1-zfs-nvme

# base policy
[zfs-nvme]
  use_template=local_sys
  recursive=yes

[zfs-nvme/pve]
  # we use local_sys because we need not too much snapshots
  # as space is limited
  use_template=local_sys
  recursive=yes


# Template to regularly snapshot
[template_local_data]
  # How often snapshots should be taken under an hour
  frequent_period=30
  # What to keep
  # number of sub-hourly snapshots
  frequently = 0
  # number of hourly snapshots
  hourly = 36
  # number of daily snashots
  daily = 30
  # number of monthly snashots
  monthly = 6
  # number of yearly snashots
  yearly = 2
  # whether snapshots should be taken automatically
  autosnap = yes
  # Should old snapshots be pruned
  autoprune = yes

# Template for system volumes
[template_local_sys]
  # How often snapshots should be taken under an hour
  frequent_period=60
  # What to keep
  # number of sub-hourly snapshots
  frequently = 0
  # number of hourly snapshots
  hourly = 36
  # number of daily snashots
  daily = 10
  # number of monthly snashots
  monthly = 6
  # number of yearly snashots
  yearly = 0
  # whether snapshots should be taken automatically
  autosnap = yes
  # Should old snapshots be pruned
  autoprune = yes



# This template is for data that is synced from another machine
# We do not create snapshots for they are provided by the source
# We only prune snapshots to use a decent space
# see https://github.com/jimsalterjrs/sanoid/wiki/Syncoid#snapshot-management-with-sanoid
[template_synced_data]
  # number of sub-hourly snapshots
  # What to keep
  frequently = 0
  # number of hourly snapshots
  hourly = 36
  # number of daily snashots
  daily = 30
  # number of monthly snashots
  monthly = 6
  # number of yearly snashots
  yearly = 2
  # disable snapshots has they come from source
  autosnap = no
  # Should old snapshots be pruned
  autoprune = yes

# policy for system data from remote servers
# We only prune snapshots to use a decent space
[template_synced_sys]
  # How often snapshots should be taken under an hour
  frequent_period=60
  # What to keep
  # number of sub-hourly snapshots
  frequently = 0
  # number of hourly snapshots
  hourly = 10
  # number of daily snashots
  daily = 10
  # number of monthly snashots
  monthly = 6
  # number of yearly snashots
  yearly = 0
  # whether snapshots should be taken automatically
  autosnap = no
  # Should old snapshots be pruned
  autoprune = yes

# template for data synced from a replication data set
[template_synced_replicate]
  # How often snapshots should be taken under an hour
  frequent_period=60
  # What to keep
  # number of sub-hourly snapshots
  frequently = 0
  # number of hourly snapshots
  hourly = 10
  # number of daily snashots
  daily = 10
  # number of monthly snashots
  monthly = 6
  # number of yearly snashots
  yearly = 0
  # whether snapshots should be taken automatically
  autosnap = no
  # Should old snapshots be pruned
  autoprune = yes
  # We need to remove syncoid snapshots
  pruning_script = /opt/openfoodfacts-infrastructure/scripts/zfs/sanoid_post_remove_synced_data_snapshots.sh

