# Stunnel clients configuration for off services
# /usr/share/doc/stunnel4/examples/stunnel.conf-sample

# we need this to run it smoothly with systemd
foreground = yes
# drop root
setuid = stunnel4
setgid = stunnel4
# use an identified pid - must match systemd service RuntimeDirectory
pid = /var/run/stunnel-off/stunnel.pid

# NOTE: this is only for client = yes service, the other should go to reverse-proxy

# connecting to off-query on moji
[off-query]
client = yes
accept = 10.1.0.105:16001
connect = 2a06:c484:5::102:16001
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/off-query-psk.txt

[scaleway-mongodb]
client = yes
accept = 10.1.0.105:27017
connect = 151.115.132.10:27017
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/scaleway-mongodb-psk.txt

[scaleway-redis]
client = yes
accept = 10.1.0.105:6379
connect = 151.115.132.10:6379
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/scaleway-redis-psk.txt

[scaleway-postgres]
client = yes
accept = 10.1.0.105:5432
connect = 151.115.132.10:5432
ciphers = PSK
PSKsecrets = /etc/stunnel/psk/scaleway-postgres-psk.txt

