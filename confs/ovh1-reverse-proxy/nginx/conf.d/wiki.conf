# ======= Against bots =======
# Use 'map' to check for the cookie and set a variable
map $http_cookie $needs_verification {
    default "yes";
    "~*verified=1" "no";
}

map $http_user_agent $bot_limit_key {
    default "";
    ~*YisouSpider $binary_remote_addr;
}
limit_req_zone $bot_limit_key zone=bot_zone:10m rate=4r/m;


server {
    server_name  off-wiki.rn7.net;
    access_log  /var/log/nginx/wiki.access.log  main;

    location / {

        proxy_pass          http://10.1.0.104;
        proxy_set_header    Host $http_host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/off-wiki.rn7.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/off-wiki.rn7.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    server_name  wiki.openfoodfacts.org;
    access_log  /var/log/nginx/wiki.access.log  main;
    client_max_body_size 40M;

    location / {

        # ======= Against bots =======
        # Check if verification is needed
        #if ($needs_verification = "yes") {
        #    add_header Content-Type text/html;
        #    return 200 '<script>document.cookie = "verified=1; Path=/;"; window.location.reload();</script>';
        #}

        limit_req zone=bot_zone burst=5;


        #proxy_pass          http://10.1.0.104;
        proxy_pass          http://127.0.0.1:8104;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Http-Version $server_protocol;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/wiki.openfoodfacts.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiki.openfoodfacts.org/privkey.pem; # managed by Certbot
}

server {
    if ($host = off-wiki.rn7.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name  off-wiki.rn7.net;
    listen 80;
    return 404; # managed by Certbot
}

server {
    if ($host = wiki.openfoodfacts.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name wiki.openfoodfacts.org;
    listen 80;
    access_log  /var/log/nginx/wiki.access.log  main;
}

