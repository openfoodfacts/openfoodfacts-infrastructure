server {
    listen 443;
    listen [::]:443;
    server_name  auth.openfoodfacts.net;

    access_log  /var/log/nginx/auth.off.net.log  main;
    error_log   /var/log/nginx/auth.off.net.errors.log;

    location / {
        proxy_pass http://10.1.0.200:5600$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90;
        client_max_body_size 512M;
    }
    ssl_certificate /etc/letsencrypt/live/auth.openfoodfacts.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auth.openfoodfacts.net/privkey.pem; # managed by Certbot

}

server {
    if ($host = auth.openfoodfacts.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name  auth.openfoodfacts.net;

}

