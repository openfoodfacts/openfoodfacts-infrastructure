
# map from service to exporter
map $uri $exporter {
    # exporter_exporter for scaleway-docker-prod
    "~/hetzner-docker-staging" 10.12.1.201:8202;
    "~/hetzner-docker-prod" 10.12.1.202:8202;
}

#log_format debug_exporter "$time_local $scheme://$host:$server_port$request_uri $exporter";

# http server
server {
    server_name hetzner-exporters.openfoodfacts.org;

    # logs location, avoid access_log, no need
    #access_log  /var/log/nginx/hetzner-exporters.log  debug_exporter;
    #access_log  /var/log/nginx/hetzner-exporters.log  main;
    access_log  off;
    error_log   /var/log/nginx/hetzner-exporters.errors.log;

    # protect
    auth_basic "Exporter metrics";
    auth_basic_user_file "/etc/nginx/.htpasswd/hetzner-exporters";

    # url to join is defined thanks to exporter variable, itself based upon uri
    location ~^/[^/]+/(?<subpath>.+)?$ {
        if ($exporter = "") {
            return 404;
        }
	proxy_pass http://$exporter/$subpath$is_args$args;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;
	proxy_set_header Host $host;
	client_max_body_size 512M;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hetzner-exporters.openfoodfacts.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hetzner-exporters.openfoodfacts.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}



server {
    if ($host = hetzner-exporters.openfoodfacts.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name hetzner-exporters.openfoodfacts.org;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
