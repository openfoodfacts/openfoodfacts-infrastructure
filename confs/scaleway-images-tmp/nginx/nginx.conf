# use same user as nginx mainline repository
user nginx;
# Images are served from HDD (zfs-hdd on scaleway-03):
# a worker blocked on a disk read (open/stat/read) stalls all its connections,
# so we run many more workers than cores (they mostly wait on IO, not CPU).
# With "auto" (= 6 cores) we had all workers in D state most of the time,
# see docs/reports/2026-11-12-slow-images-on-scaleway-03.md
worker_processes 32;
# each worker can use up to 2 fds per connection
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

# thread pool used by "aio threads" to offload file reads from workers
# (default is 32 threads per worker, which is a lot with 32 workers)
thread_pool default threads=8 max_queue=65536;

events {
	worker_connections 4096;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off; # Recommended practice is to turn this off

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3 (POODLE), TLS 1.0, 1.1
	ssl_prefer_server_ciphers off; # Don't force server cipher order.

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	# this is done in /etc/nginx/conf.d/zz-sites-enabled.conf
	# include /etc/nginx/sites-enabled/*;
}
